<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Página não encontrada · dichava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--v:#4CAF5A;--creme:#FBF7EC;--dk:#141A14;--dk2:#1B2A1C;--tx:#F3F7F0;--txs:#AEBDA6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 50% -10%,#22301F 0%,#141A14 60%);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.55;overflow:hidden;position:relative}
/* folhas soltas de fundo */
.leaf-bg{position:fixed;fill:none;stroke:#4CAF5A;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.08;pointer-events:none}
.l1{width:150px;top:8%;left:6%;transform:rotate(-18deg);animation:sway 7s ease-in-out infinite}
.l2{width:110px;bottom:12%;right:9%;transform:rotate(25deg);animation:sway 9s ease-in-out infinite reverse}
.l3{width:80px;top:20%;right:14%;transform:rotate(8deg);animation:sway 8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(0) rotate(var(--r,0))}50%{transform:translateY(-12px) rotate(calc(var(--r,0) + 4deg))}}
.box{max-width:460px;text-align:center;position:relative;z-index:1}
.big{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px}
.big .n{font-family:'Bagel Fat One',system-ui;font-size:96px;line-height:1;color:var(--creme)}
.big .o{width:92px;height:92px;border-radius:28px;background:radial-gradient(circle at 32% 28%,#4a7856,#2f5740 80%);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -14px rgba(47,163,95,.6);animation:bob 4s ease-in-out infinite}
.big .o svg{width:52px;height:52px;fill:none;stroke:#f6f3ea;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
h1{font-family:'Bagel Fat One',system-ui;font-weight:400;font-size:27px;letter-spacing:.01em;margin:14px 0 10px;color:var(--creme)}
p{margin:0 0 26px;color:var(--txs);font-size:16px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:14px;padding:13px 22px;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer;border:none}
.b.p{background:var(--v);color:#08210f}
.b.s{background:var(--dk2);color:var(--tx);border:1.5px solid #2A3622}
@media(max-width:480px){.big .n{font-size:74px}.big .o{width:72px;height:72px;border-radius:22px}.big .o svg{width:40px;height:40px}}
</style>
</head>
<body>
<svg class="leaf-bg l1" style="--r:-18deg" viewBox="0 0 24 24"><path d="M4 20c0-8 6-14 16-15C19 13 13 20 5 20"/><path d="M4 20c3-4 6-6 10-8"/></svg>
<svg class="leaf-bg l2" style="--r:25deg" viewBox="0 0 24 24"><path d="M4 20c0-8 6-14 16-15C19 13 13 20 5 20"/><path d="M4 20c3-4 6-6 10-8"/></svg>
<svg class="leaf-bg l3" style="--r:8deg" viewBox="0 0 24 24"><path d="M4 20c0-8 6-14 16-15C19 13 13 20 5 20"/><path d="M4 20c3-4 6-6 10-8"/></svg>
<div class="box">
  <div class="big">
    <span class="n">4</span>
    <span class="o"><svg viewBox="0 0 24 24"><path d="M4 20c0-8 6-14 16-15C19 13 13 20 5 20"/><path d="M4 20c3-4 6-6 10-8"/></svg></span>
    <span class="n">4</span>
  </div>
  <h1>Essa folha o vento levou</h1>
  <p>A página que você procurou não está aqui. Pode ser um link antigo ou algo que saiu do ar. Sem estresse, é só voltar.</p>
  <div class="btns">
    <a class="b p" href="/">Voltar ao início</a>
    <a class="b s" href="/blog/">Ler o blog</a>
  </div>
</div>
</body>
</html>
