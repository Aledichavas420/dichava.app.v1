<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Página não encontrada · dichava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--tx:#16241A;--txs:#5A6B5E;--bg:#F6F8F5;--card:#fff;--v:#2FA35F}
@media (prefers-color-scheme:dark){:root{--tx:#E9EFE7;--txs:#AEBDA9;--bg:#0F140F;--card:#171E17}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.55}
.box{max-width:440px;text-align:center}
.mk{width:76px;height:76px;border-radius:24px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#12321F,#2FA35F 70%,#49B673);box-shadow:0 14px 34px -14px rgba(47,163,95,.6)}
.code{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--v);text-transform:uppercase;margin-bottom:6px}
h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
p{margin:0 0 24px;color:var(--txs);font-size:15.5px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:13px;padding:13px 22px;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer;border:none}
.b.p{background:var(--v);color:#fff}
.b.s{background:var(--card);color:var(--tx);border:1.5px solid rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){.b.s{border-color:rgba(255,255,255,.12)}}
</style>
</head>
<body>
<div class="box">
  <div class="mk"><svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7.6l5.5 2.8 5.5-2.8M6.5 16.4l5.5-2.8 5.5 2.8M12 10.4v3.2"/><circle cx="6.5" cy="7.6" r="1.8" fill="#fff"/><circle cx="17.5" cy="7.6" r="1.8" fill="#fff"/><circle cx="6.5" cy="16.4" r="1.8" fill="#fff"/><circle cx="17.5" cy="16.4" r="1.8" fill="#fff"/><circle cx="12" cy="12" r="2.2" fill="#fff"/></svg></div>
  <div class="code">Erro 404</div>
  <h1>Essa página a gente não achou</h1>
  <p>O link pode estar errado ou a página saiu do ar. Sem problema, dá pra voltar e seguir no seu ritmo.</p>
  <div class="btns">
    <a class="b p" href="/">Voltar ao início</a>
    <a class="b s" href="/blog/">Ler o blog</a>
  </div>
</div>
</body>
</html>
