async function carregar(){

    const{data,error}=await SB.from('blog_posts').select('*').eq('status','publicado').order('publicado_em',{ascending:false});
    if(error) throw error; _posts=data||[];
  }catch(e){ _posts=[]; }
  try{

    _banners=bn||[];

}

function initCarousel(n){
  _hc.i=0; _hc.n=n; clearInterval(_hc.timer);

  }
}
