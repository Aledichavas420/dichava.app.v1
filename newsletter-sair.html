<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Descadastrar — dichava.app</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d120d;color:#eaf3ee;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:420px;width:100%;background:#141b14;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:32px 26px;text-align:center}
h1{font-size:19px;margin-bottom:10px}
p{font-size:14px;color:#9db0a6;line-height:1.6}
a{color:#5BC06F}
.ic{font-size:40px;margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
  <div class="ic" id="ic">💌</div>
  <h1 id="tt">Um instante…</h1>
  <p id="ms">Processando seu descadastro.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
  var tt=document.getElementById('tt'), ms=document.getElementById('ms'), ic=document.getElementById('ic');
  var t=new URLSearchParams(location.search).get('t');
  function fail(msg){ic.textContent='😕';tt.textContent='Não deu certo';ms.textContent=msg||'Link inválido ou expirado.';}
  if(!t){fail('Link sem código de descadastro.');return;}
  try{
    var sb=supabase.createClient('https://gnpwaywyexcevtzbwiyq.supabase.co','sb_publishable_JBxiSIYDYRBxgBunmedHfA_BJDCffZ4');
    var r=await sb.rpc('newsletter_unsub',{p_token:t});
    if(r.error) throw r.error;
    ic.textContent='✅';tt.textContent='Pronto, você saiu da lista';
    ms.innerHTML='Não vamos mais te enviar e-mails da newsletter. Se mudar de ideia, é só se inscrever de novo em <a href="/landing/">dichava.app</a>. 💚';
  }catch(e){ fail('Não consegui processar agora. Tente abrir o link de novo mais tarde.'); }
})();
</script>
</body>
</html>
