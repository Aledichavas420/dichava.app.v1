# dichava.app — configuração do Netlify (usada só no ambiente de teste)
#
# Só define cabeçalhos de segurança. Não há build nem publish aqui de
# propósito: o site é estático servido da raiz do repositório, e mexer
# nisso poderia mudar o que é publicado.
#
# Em produção (dichava.app = GitHub Pages + Cloudflare) este arquivo é
# ignorado; lá os mesmos cabeçalhos vão na Cloudflare (Transform Rules).

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
