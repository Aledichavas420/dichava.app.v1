<!doctype html><html lang=pt-BR><head><meta charset=utf-8>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'">
<meta name=viewport content="width=device-width, initial-scale=1">
<title>Validar certificado — dichava.app</title>
<meta name=robots content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#eef2ea;color:#1B2A1C;line-height:1.6;padding:22px 14px 60px}
.wrap{max-width:1180px;margin:0 auto}
.top{text-align:center;margin-bottom:18px}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:#1B2A1C;text-decoration:none}
.logo span{color:#2E7D32}.logo svg{width:24px;height:24px;color:#4CAF5A}
.status{max-width:560px;margin:14px auto 22px;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600}
.status.ok{background:#E6F6EC;border:1px solid #BBE6C6;color:#1E6B3A}
.status.bad{background:#FDECEC;border:1px solid #F3C2C2;color:#B3261E}
.status.load{background:#fff;border:1px solid #e2ece3;color:#5E7062;justify-content:center}
.status svg{width:22px;height:22px;flex:none}
.spin{width:20px;height:20px;border:3px solid #cfe0d4;border-top-color:#2E7D32;border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.actions{max-width:1120px;margin:0 auto 14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:#2fbd6a;color:#fff;border:none;border-radius:26px;padding:12px 22px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;border:1.5px solid #cfe0d4;color:#2E7D32}
.btn svg{width:17px;height:17px}
/* área do certificado + escala responsiva */
.stage{overflow:auto;display:flex;justify-content:center}
.scaler{transform-origin:top center}
/* ===== CERTIFICADO (base) ===== */
.cert{width:1120px;height:792px;position:relative;overflow:hidden;background:#fff;flex:none;box-shadow:0 18px 50px rgba(24,58,33,.16)}
.cert .qr{background:#fff}
.cert .qr canvas,.cert .qr img{display:block;width:100%;height:100%}
/* modelo A — clássico */
.cert.a{background:#FAF8F1;padding:54px 64px}
.cert.a::before{content:"";position:absolute;inset:20px;border:2px solid #2E7D32;border-radius:4px;pointer-events:none}
.cert.a::after{content:"";position:absolute;inset:27px;border:1px solid #cdd9ca;border-radius:2px;pointer-events:none}
.a .inner{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:1}
.a .brand{display:flex;align-items:center;gap:8px;color:#1B2A1C;font-weight:800;font-size:21px}
.a .brand span{color:#2E7D32}.a .brand svg{width:26px;height:26px;color:#4CAF5A}
.a .date{position:absolute;top:0;right:0;font-size:13px;color:#5E7062}
.a .kick{margin-top:26px;font-size:13px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#2E7D32}
.a .title{font-family:'Playfair Display',serif;font-size:50px;font-weight:800;color:#1B2A1C;margin-top:8px;line-height:1}
.a .introl{margin-top:30px;font-size:16px;color:#5E7062}
.a .name{font-family:'Playfair Display',serif;font-size:40px;font-weight:700;color:#1E6B3A;margin-top:10px;padding:0 30px 10px;border-bottom:2px solid #d8e3d6}
.a .body{margin-top:22px;font-size:16.5px;color:#3f5a45;line-height:1.7;max-width:760px}
.a .body b{color:#1B2A1C}
.a .foot{margin-top:auto;width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}
.a .sign{text-align:center;flex:1}
.a .sign .line{width:260px;border-top:1.5px solid #1B2A1C;margin:0 auto 7px}
.a .sign .nm{font-weight:700;font-size:15px;color:#1B2A1C}
.a .sign .rl{font-size:13px;color:#5E7062;margin-top:1px}
.a .val{display:flex;align-items:center;gap:12px;text-align:left}
.a .qr{width:92px;height:92px;flex:none}
.a .vt{font-size:11px;color:#5E7062;line-height:1.5}
.a .vt b{color:#1B2A1C;font-size:12px}.a .vt .code{font-family:monospace;font-size:12.5px;color:#2E7D32;font-weight:700}
/* modelo B — moderno */
.cert.b{display:flex;flex-direction:column}
.b .band{background:linear-gradient(130deg,#1E6B3A,#143E27 70%);color:#fff;padding:34px 58px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.b .band::after{content:"";position:absolute;right:-50px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(76,185,106,.18)}
.b .band .lg{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;position:relative;z-index:1}
.b .band .lg span{color:#8FE3A6}.b .band .lg svg{width:30px;height:30px;color:#8FE3A6}
.b .band .kick{text-align:right;position:relative;z-index:1}
.b .band .kick .k1{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#a9c6b6}
.b .band .kick .k2{font-size:26px;font-weight:800;margin-top:2px}
.b .main{flex:1;padding:46px 64px 30px;display:flex;flex-direction:column}
.b .introl{font-size:17px;color:#5E7062}
.b .name{font-size:46px;font-weight:800;color:#1B2A1C;margin:8px 0 6px;letter-spacing:-1px}
.b .rule{width:80px;height:5px;background:#4CAF5A;border-radius:3px;margin-bottom:22px}
.b .body{font-size:17.5px;color:#3f5a45;line-height:1.75;max-width:820px}.b .body b{color:#1B2A1C}
.b .meta{display:flex;gap:40px;margin-top:26px}
.b .meta .ml{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#8a9a86}
.b .meta .mv{font-size:17px;font-weight:700;color:#1B2A1C;margin-top:3px}
.b .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:30px;padding-top:20px;border-top:1px solid #e6ece7}
.b .sign{text-align:center}
.b .sign .line{width:250px;border-top:1.5px solid #1B2A1C;margin:0 auto 7px}
.b .sign .nm{font-weight:700;font-size:15px;color:#1B2A1C}.b .sign .rl{font-size:13px;color:#5E7062;margin-top:1px}
.b .val{display:flex;align-items:center;gap:13px}
.b .qr{width:94px;height:94px;flex:none;border:1px solid #e6ece7;border-radius:8px;padding:4px}
.b .vt{font-size:11.5px;color:#5E7062;line-height:1.55}
.b .vt b{color:#1B2A1C;font-size:12px}.b .vt .code{font-family:monospace;font-size:13px;color:#1E6B3A;font-weight:700}
.foot-note{text-align:center;color:#8a9a86;font-size:12.5px;margin-top:22px}
.foot-note a{color:#2E7D32;text-decoration:none;font-weight:700}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff;padding:0}
  .top,.status,.actions,.foot-note{display:none!important}
  .stage{overflow:visible}
  .scaler{transform:none!important}
  .cert{box-shadow:none}
}
</style></head>
<body>
<div class="wrap">
  <div class="top"><a class="logo" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c0-8 6-14 16-15C19 13 13 20 5 20"/><path d="M4 20c3-4 6-6 10-8"/></svg> dichava<span>.app</span></a></div>
  <div class="status load" id="status"><span class="spin"></span> Verificando certificado…</div>
  <div class="actions" id="actions" style="display:none">
    <button class="btn" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg> Baixar / imprimir PDF</button>
  </div>
  <div class="stage"><div class="scaler" id="scaler"></div></div>
  <div class="foot-note" id="fnote" style="display:none">Certificado emitido pela Rede dichava · <a href="/">dichava.app</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var SB=null;
try{ SB=supabase.createClient('https://gnpwaywyexcevtzbwiyq.supabase.co','sb_publishable_JBxiSIYDYRBxgBunmedHfA_BJDCffZ4'); }catch(e){}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataLonga(iso){ if(!iso)return''; var p=String(iso).slice(0,10).split('-'); if(p.length<3)return iso; return (+p[2])+' de '+MESES[(+p[1])-1]+' de '+p[0]; }
function qparam(k){ return new URLSearchParams(location.search).get(k)||''; }
function leaf(c){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c0-8 6-14 16-15C19 13 13 20 5 20"/><path d="M4 20c3-4 6-6 10-8"/></svg>'; }

function certA(d){
  return '<div class="cert a"><div class="inner">'
   +'<div class="date">'+esc(d.local_emissao||'')+(d.local_emissao?', ':'')+esc(dataLonga(d.data_evento))+'</div>'
   +'<div class="brand">'+leaf()+' dichava<span>.app</span></div>'
   +'<div class="kick">Certificado de Participação</div>'
   +'<div class="title">Certificado</div>'
   +'<div class="introl">Certificamos que</div>'
   +'<div class="name">'+esc(d.nome)+'</div>'
   +'<div class="body">participou da roda de conversa <b>"'+esc(d.evento)+'"</b>, promovida pela <b>Rede dichava</b>, realizada em <b>'+esc(dataLonga(d.data_evento))+'</b>'+(d.carga_horaria?', com carga horária de <b>'+esc(d.carga_horaria)+'</b>':'')+'.</div>'
   +'<div class="foot">'
     +'<div class="val"><div class="qr" id="qrbox"></div><div class="vt"><b>Autenticidade</b><br>Valide em dichava.app/validar<br>Código <span class="code">'+esc(d.codigo)+'</span></div></div>'
     +'<div class="sign"><div class="line"></div><div class="nm">Alexandre Monteiro</div><div class="rl">Psicólogo · CRP 16/7696 · Rede dichava</div></div>'
   +'</div></div></div>';
}
function certB(d){
  return '<div class="cert b">'
   +'<div class="band"><div class="lg">'+leaf()+' dichava<span>.app</span></div><div class="kick"><div class="k1">Rede dichava · Redução de danos</div><div class="k2">Certificado de Participação</div></div></div>'
   +'<div class="main">'
     +'<div class="introl">Certificamos que</div>'
     +'<div class="name">'+esc(d.nome)+'</div><div class="rule"></div>'
     +'<div class="body">participou da roda de conversa <b>"'+esc(d.evento)+'"</b>, promovida pela Rede dichava, um espaço de formação e troca entre profissionais de saúde na perspectiva da redução de danos.</div>'
     +'<div class="meta"><div class="m"><div class="ml">Data</div><div class="mv">'+esc(dataLonga(d.data_evento))+'</div></div>'
       +(d.carga_horaria?'<div class="m"><div class="ml">Carga horária</div><div class="mv">'+esc(d.carga_horaria)+'</div></div>':'')
       +(d.modalidade?'<div class="m"><div class="ml">Modalidade</div><div class="mv">'+esc(d.modalidade)+'</div></div>':'')+'</div>'
     +'<div class="foot">'
       +'<div class="val"><div class="qr" id="qrbox"></div><div class="vt"><b>Autenticidade</b><br>Valide em dichava.app/validar<br>Código <span class="code">'+esc(d.codigo)+'</span></div></div>'
       +'<div class="sign"><div class="line"></div><div class="nm">Alexandre Monteiro</div><div class="rl">Psicólogo · CRP 16/7696 · Rede dichava</div></div>'
     +'</div>'
   +'</div></div>';
}

function desenharQR(url){
  try{
    var box=document.getElementById('qrbox'); if(!box||typeof QRCode==='undefined')return;
    new QRCode(box,{text:url,width:92,height:92,colorDark:'#143E27',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  }catch(e){}
}
function ajustarEscala(){
  var sc=document.getElementById('scaler'); if(!sc||!sc.firstChild)return;
  var disp=Math.min(1, (Math.min(window.innerWidth,1180)-28)/1120);
  sc.style.transform='scale('+disp+')';
  sc.style.height=(792*disp)+'px';
}
function mostrarStatus(cls,html){ var s=document.getElementById('status'); s.className='status '+cls; s.innerHTML=html; }

async function validar(){
  var cod=qparam('c').trim();
  if(!cod){ mostrarStatus('bad', iconBad()+' Nenhum código informado. Use o link ou o QR do certificado.'); return; }
  if(!SB){ mostrarStatus('bad', iconBad()+' Não consegui verificar agora. Tente novamente mais tarde.'); return; }
  var d=null;
  try{ var r=await SB.rpc('cert_validar',{p_codigo:cod}); d=r.data; }catch(e){ d=null; }
  if(!d){ mostrarStatus('bad', iconBad()+' Certificado não encontrado. Confira o código <b>'+esc(cod)+'</b>.'); return; }
  mostrarStatus('ok', iconOk()+' Certificado válido · emitido pela Rede dichava.');
  var sc=document.getElementById('scaler');
  sc.innerHTML = (d.modelo==='a') ? certA(d) : certB(d);
  desenharQR(location.origin+'/validar/?c='+encodeURIComponent(d.codigo));
  document.getElementById('actions').style.display='flex';
  document.getElementById('fnote').style.display='block';
  ajustarEscala();
}
function iconOk(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>'; }
function iconBad(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>'; }
window.addEventListener('resize',ajustarEscala);
validar();
</script>
</body></html>
