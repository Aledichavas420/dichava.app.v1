<!doctype html><html lang=pt-BR><head><meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dichavando</title>
<meta name=description content="Dichavando — redução de danos, sem julgamento. Links da comunidade.">
<meta property="og:title" content="Dichavando">
<meta property="og:description" content="Redução de danos, sem julgamento.">
<meta property="og:image" content="/og-image.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;min-height:100vh;color:#f4f0e6;transition:background .3s;-webkit-font-smoothing:antialiased}
.leaves{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.leaf{position:absolute;top:-8%;fill:none;stroke:rgba(255,255,255,.15);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}14%{opacity:.26}86%{opacity:.26}100%{transform:translateY(112vh) translateX(var(--dx,20px)) rotate(var(--rot,240deg));opacity:0}}
.wrap{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:60px 20px 40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}
.avw{position:relative;width:96px;height:96px;margin-bottom:16px}
.av{width:96px;height:96px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-family:'Bagel Fat One';font-size:30px;box-shadow:0 14px 32px rgba(0,0,0,.34),inset 0 0 0 4px rgba(255,255,255,.06)}
.av img{width:100%;height:100%;object-fit:cover}
.av img.mascote{object-fit:contain;padding:8px}
.seal{position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:#4CAF5A;border:3px solid var(--sealbd,#123A24);display:grid;place-items:center;box-shadow:0 3px 9px rgba(0,0,0,.28)}
.seal svg{width:14px;height:14px}
.nome{font-family:'Bagel Fat One',system-ui;font-size:27px;letter-spacing:.3px;line-height:1.08}
.subt{font-size:14px;opacity:.82;margin-top:9px;max-width:330px;line-height:1.55}
.links{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:12px}
.lk{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:12px 13px;transition:transform .15s,background .15s,border-color .15s;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.lk:hover{transform:translateY(-2px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
.lk:active{transform:translateY(0)}
.lk-ic{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.12)}
.lk-tx{flex:1;min-width:0;text-align:left}
.lk-t{font-weight:800;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lk-d{display:block;font-size:12px;opacity:.58;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-go{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:13px;opacity:.85;transition:transform .15s}
.lk:hover .lk-go{transform:translate(2px,-2px)}
.lk.primary{background:var(--acc,#4CAF5A);color:var(--accTx,#08210f);border-color:transparent;box-shadow:0 12px 26px -8px rgba(0,0,0,.45)}
.lk.primary .lk-ic{background:rgba(0,0,0,.13)}
.lk.primary .lk-d{opacity:.72}
.lk.primary .lk-go{background:rgba(0,0,0,.13)}
.pubs{width:100%;margin-top:32px;text-align:left}
.pub{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:9px;margin-bottom:10px;transition:transform .15s,background .15s,border-color .15s}
.pub:hover{transform:translateY(-2px);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.pub-cap{width:66px;height:66px;border-radius:11px;flex:none;overflow:hidden;position:relative;display:grid;place-items:center}
.pub-cap img{width:100%;height:100%;object-fit:cover}
.pub-cap svg{width:30px;height:30px;fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.pub-tx{flex:1;min-width:0}
.pub-tema{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.62}
.pub-t{font-weight:700;font-size:14px;line-height:1.28;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.light .pub{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.08)}
.light .pub:hover{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12)}
.faq{width:100%;margin-top:30px;text-align:left}
.faq-h{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.65;margin:0 4px 12px;text-align:center}
.fq{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;margin-bottom:9px}
.fq summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:'▾';opacity:.5;transition:transform .22s;flex:none}
.fq[open] summary::after{transform:rotate(180deg)}
.fq .fa{padding:0 16px 15px;font-size:13.5px;line-height:1.6;opacity:.88;white-space:pre-wrap}
.foot{margin-top:auto;padding-top:38px;font-size:12px;opacity:.55}
.foot a{color:inherit;font-weight:700;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.light .lk{background:rgba(0,0,0,.035);border-color:rgba(0,0,0,.08);box-shadow:0 6px 16px rgba(30,60,35,.06)}
.light .lk:hover{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12)}
.light .lk-ic{background:rgba(0,0,0,.06)}
.light .lk-go{background:rgba(0,0,0,.06)}
.light .av{border-color:rgba(0,0,0,.12);box-shadow:0 12px 30px rgba(30,60,35,.14)}
.light .fq{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.08)}
.light .leaf{stroke:rgba(30,60,35,.14)}
@media (prefers-reduced-motion:reduce){.leaf{animation:none;opacity:.12}}
</style></head>
<body>
<div class="leaves" id="leaves"></div>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var params=new URLSearchParams(location.search), PREVIEW=params.has('preview');
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var SEAL='<svg viewBox="0 0 24 24" fill="none" stroke="#08210f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
var LEAF='<path d="M4 20c0-8 6-14 16-15C19 13 13 20 5 20"/><path d="M4 20c3-4 6-6 10-8"/>';
var THEMES={
  verde:{bg:'radial-gradient(1000px 560px at 50% -10%,#3f7857,transparent 58%),linear-gradient(165deg,#123A24,#0c2a19)',tx:'#f4f0e6',acc:'#8FE06B',accTx:'#08210f',seal:'#123A24',light:false},
  floresta:{bg:'linear-gradient(160deg,#0F5132,#08281a)',tx:'#f4f0e6',acc:'#FFCF87',accTx:'#231a08',seal:'#0F5132',light:false},
  roxo:{bg:'radial-gradient(900px 500px at 50% -10%,#5C3FB0,transparent 60%),linear-gradient(160deg,#2d1f52,#171030)',tx:'#f4f0e6',acc:'#C9B3F7',accTx:'#1a1030',seal:'#2d1f52',light:false},
  noite:{bg:'linear-gradient(165deg,#101820,#05080c)',tx:'#eaf3ee',acc:'#5CE3CF',accTx:'#052420',seal:'#101820',light:false},
  claro:{bg:'radial-gradient(120% 60% at 80% -5%,#DFF3E4,transparent 55%),#F6FAF6',tx:'#1B2A1C',acc:'#2FA35F',accTx:'#fff',seal:'#F6FAF6',light:true}
};
var POSTS=[];
var TEMA_NOME={rd:'Redução de danos',clinica:'Clínica e cuidado',politica:'Política de drogas',saude:'Saúde mental',familia:'Família e vínculos',ciencia:'Ciência e evidências',historias:'Histórias e vivências'};
var TEMA_GRAD={rd:'linear-gradient(135deg,#12894e,#2fd0a0)',clinica:'linear-gradient(135deg,#0e7490,#22b8cf)',politica:'linear-gradient(135deg,#6d28d9,#db2777)',saude:'linear-gradient(135deg,#2563eb,#4f46e5)',familia:'linear-gradient(135deg,#ea580c,#f43f5e)',ciencia:'linear-gradient(135deg,#0d9488,#22c55e)',historias:'linear-gradient(135deg,#db2777,#f59e0b)'};
function gradOf(t){return TEMA_GRAD[t]||'linear-gradient(135deg,#153726,#2f7d45)';}
function proHref(u){u=(u||'').trim();if(!u)return'';if(/^https?:\/\//i.test(u))return u;if(/^@/.test(u))return 'https://instagram.com/'+u.slice(1);if(/^mailto:|^tel:/i.test(u))return u;return 'https://'+u;}
function domainOf(u){try{if(/^@/.test((u||'').trim()))return 'instagram.com';var h=proHref(u);var m=h.match(/^https?:\/\/([^\/?#]+)/i);return m?m[1].replace(/^www\./,''):'';}catch(e){return'';}}
function render(cfg){
  cfg=cfg||{};
  var t=THEMES[cfg.tema]||THEMES.verde;
  document.body.style.background=t.bg; document.body.style.color=t.tx;
  document.body.className=t.light?'light':'';
  document.documentElement.style.setProperty('--acc',cfg.cor||t.acc);
  document.documentElement.style.setProperty('--accTx',t.accTx);
  document.documentElement.style.setProperty('--sealbd',t.seal);
  var nome=cfg.nome||'Dichavando';
  var links=Array.isArray(cfg.links)?cfg.links:[];
  var faq=Array.isArray(cfg.faq)?cfg.faq:[];
  var avatar=cfg.avatar||'/guia-assets/dichavaldo.svg';
  var isMasc=/dichavaldo/.test(avatar);
  var h='<div class="avw"><div class="av"><img class="'+(isMasc?'mascote':'')+'" src="'+esc(avatar)+'" alt=""></div>'+(cfg.selo!==false?'<div class="seal">'+SEAL+'</div>':'')+'</div>'+
    '<div class="nome">'+esc(nome)+'</div>'+
    (cfg.subtitulo?'<div class="subt">'+esc(cfg.subtitulo)+'</div>':'')+
    '<div class="links">';
  links.forEach(function(l){ if(!l||(!l.titulo&&!l.url))return;
    var href=PREVIEW?'javascript:void 0':proHref(l.url);
    var dom=domainOf(l.url);
    h+='<a class="lk'+(l.destaque?' primary':'')+'" href="'+esc(href)+'"'+(PREVIEW?'':' target="_blank" rel="noopener"')+'><span class="lk-ic">'+esc(l.icone||'🔗')+'</span><span class="lk-tx"><span class="lk-t">'+esc(l.titulo||l.url)+'</span>'+(dom?'<span class="lk-d">'+esc(dom)+'</span>':'')+'</span><span class="lk-go">↗</span></a>';
  });
  h+='</div>';
  if(POSTS && POSTS.length){
    h+='<div class="pubs"><div class="faq-h">Últimas publicações</div>';
    POSTS.forEach(function(pp){
      var href='https://dichava.app/blog/p/'+encodeURIComponent(pp.slug)+'/';
      var cap=pp.capa?('<span class="pub-cap"><img src="'+esc(pp.capa)+'" alt=""></span>')
                     :('<span class="pub-cap" style="background:'+gradOf(pp.tema)+'"><svg viewBox="0 0 24 24">'+LEAF+'</svg></span>');
      h+='<a class="pub" href="'+href+'"'+(PREVIEW?'':' target="_blank" rel="noopener"')+'>'+cap+
         '<span class="pub-tx">'+(pp.tema?'<span class="pub-tema">'+esc(TEMA_NOME[pp.tema]||pp.tema)+'</span>':'')+
         '<span class="pub-t">'+esc(pp.titulo)+'</span></span></a>';
    });
    h+='</div>';
  }
  var fq=faq.filter(function(f){return f&&(f.q||f.pergunta);});
  if(fq.length){
    h+='<div class="faq"><div class="faq-h">Perguntas frequentes</div>'+
      fq.map(function(f){return '<details class="fq"><summary>'+esc(f.q||f.pergunta)+'</summary><div class="fa">'+esc(f.a||f.resposta||'')+'</div></details>';}).join('')+
    '</div>';
  }
  h+='<div class="foot">feito com 🌱 <a href="/landing/" target="_blank" rel="noopener">dichava.app</a></div>';
  document.getElementById('app').innerHTML=h;
}
// folhas
(function(){var box=document.getElementById('leaves');var n=Math.max(7,Math.min(16,Math.round(8*(innerWidth/430))));var s='';for(var i=0;i<n;i++){var sz=(22+Math.random()*34)|0,left=(Math.random()*100).toFixed(1),dur=(8+Math.random()*6),del=(-(Math.random()*dur)).toFixed(1),dx=((Math.random()*120-60)|0),rot=((Math.random()*360+150)|0);s+='<svg class="leaf" viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" style="left:'+left+'%;--dx:'+dx+'px;--rot:'+rot+'deg;animation-duration:'+dur.toFixed(1)+'s;animation-delay:'+del+'s">'+LEAF+'</svg>';}box.innerHTML=s;})();

if(PREVIEW){
  render({}); // placeholder até chegar config do editor
  window.addEventListener('message',function(e){var d=e.data;if(d&&d.type==='bio-site-preview'){try{render(d.config||{});}catch(err){}}});
  try{parent.postMessage({type:'bio-site-ready'},'*');}catch(e){}
}else{
  var SB=null; try{ SB=supabase.createClient('https://gnpwaywyexcevtzbwiyq.supabase.co','sb_publishable_JBxiSIYDYRBxgBunmedHfA_BJDCffZ4'); }catch(e){}
  (async function(){
    var cfg={nome:'Dichavando',subtitulo:'Redução de danos, sem julgamento 🌱',tema:'verde',
      links:[{icone:'📸',titulo:'Instagram',url:'@dichavandoard',destaque:true},{icone:'🌱',titulo:'Conhecer o dichava.app',url:'https://dichava.app/landing/'}],
      faq:[{q:'O que é redução de danos?',a:'É uma abordagem de cuidado que encontra a pessoa onde ela está, sem exigir a abstinência como porta de entrada.'},{q:'O dichava.app é gratuito?',a:'Sim, o app para quem usa é 100% gratuito.'}]};
    try{ if(SB){ var r=await SB.from('bio_site').select('dados').eq('id',1).maybeSingle(); if(r.data&&r.data.dados&&Object.keys(r.data.dados).length)cfg=r.data.dados; } }catch(e){}
    try{ if(SB){ var rp=await SB.from('blog_posts').select('slug,titulo,capa,tema').eq('status','publicado').eq('destaque_bio',true).order('publicado_em',{ascending:false}).limit(6); POSTS=rp.data||[]; } }catch(e){ POSTS=[]; }
    render(cfg);
  })();
}
</script>
</body></html>
